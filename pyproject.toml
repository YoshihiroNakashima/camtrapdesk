[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camtrapdesk"
version = "0.1.0"
description = "カメラトラップのSDカード取り込み・NAS転送・地点名変更・削除をGUIで行うデスクトップアプリ"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yoshihiro Nakashima" }]
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "xxhash>=3.0", "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
camtrapdesk = "camtrapdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["camtrapdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "exe と zip を添付する既存 Release のタグ（例: v0.1.1）。空ならビルドだけ"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # 240 秒で全スレッドのスタックを出して終了する（CI でだけ止まる原因を見つけるため）
          QT_QPA_PLATFORM=offscreen python -X faulthandler -c "import faulthandler, sys, pytest; faulthandler.dump_traceback_later(240, exit=True); sys.exit(pytest.main(['-q', '-rA', '--tb=short', '-p', 'no:cacheprovider']))" 2>&1 | tee pytest.txt
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          # 失敗の要点を注釈に出す（ログがダウンロードできない環境からも読めるように）
          tail -n 120 pytest.txt | python -c "import sys; print('::error title=pytest::' + sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: camtrapdesk-windows
          - os: macos-latest          # Apple Silicon (M1 以降)
            artifact: camtrapdesk-macos-apple-silicon
          - os: macos-15-intel        # Intel Mac
            artifact: camtrapdesk-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name camtrapdesk --paths . --collect-all openpyxl --collect-all imageio_ffmpeg tools/entry.py
          # アーティファクトの中でフォルダが付かないよう、zip と同じくリポジトリ直下に置く
          mv dist/camtrapdesk.exe ./camtrapdesk-windows.exe
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name camtrapdesk --paths . --collect-all openpyxl --collect-all imageio_ffmpeg tools/entry.py
          # 署名していないので、初回は「システム設定 > プライバシーとセキュリティ」で許可が必要（README 参照）
          cd dist && ditto -c -k --sequesterRsrc --keepParent camtrapdesk.app ../${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            camtrapdesk-windows.exe
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/**/camtrapdesk-windows.exe
            dist/**/camtrapdesk-macos-apple-silicon.zip
            dist/**/camtrapdesk-macos-intel.zip
          body: |
            - Windows: `camtrapdesk-windows.exe` をダウンロードしてダブルクリック（Python 不要）。初回は SmartScreen の「詳細情報」→「実行」。
            - Mac (M1 以降): `camtrapdesk-macos-apple-silicon.zip` を展開し、camtrapdesk.app をアプリケーションに入れる。初回は「システム設定 > プライバシーとセキュリティ」で「このまま開く」。
            - Mac (Intel): `camtrapdesk-macos-intel.zip`。手順は同じ。

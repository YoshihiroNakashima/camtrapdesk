name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: camtrapdesk-windows
          - os: macos-latest          # Apple Silicon (M1 以降)
            artifact: camtrapdesk-macos-apple-silicon
          - os: macos-15-intel        # Intel Mac
            artifact: camtrapdesk-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name camtrapdesk --paths . --collect-all openpyxl tools/entry.py
          mv dist/camtrapdesk.exe dist/camtrapdesk-windows.exe
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name camtrapdesk --paths . --collect-all openpyxl tools/entry.py
          # 署名していないので、初回は「システム設定 > プライバシーとセキュリティ」で許可が必要（README 参照）
          cd dist && ditto -c -k --sequesterRsrc --keepParent camtrapdesk.app ../${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/camtrapdesk-windows.exe
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/camtrapdesk-windows.exe
            dist/camtrapdesk-macos-apple-silicon.zip
            dist/camtrapdesk-macos-intel.zip
          body: |
            - Windows: `camtrapdesk-windows.exe` をダウンロードしてダブルクリック（Python 不要）。初回は SmartScreen の「詳細情報」→「実行」。
            - Mac (M1 以降): `camtrapdesk-macos-apple-silicon.zip` を展開し、camtrapdesk.app をアプリケーションに入れる。初回は「システム設定 > プライバシーとセキュリティ」で「このまま開く」。
            - Mac (Intel): `camtrapdesk-macos-intel.zip`。手順は同じ。

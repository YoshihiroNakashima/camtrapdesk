name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: camtrapdesk-windows
          - os: macos-latest
            artifact: camtrapdesk-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name camtrapdesk
          --collect-all openpyxl camtrapdesk/__main__.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name camtrapdesk --collect-all openpyxl camtrapdesk/__main__.py
          cd dist && zip -r -y camtrapdesk-macos.zip camtrapdesk.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/camtrapdesk.exe
            dist/camtrapdesk-macos.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/camtrapdesk.exe
            dist/camtrapdesk-macos.zip
